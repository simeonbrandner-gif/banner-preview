<title>Cailler Autumn Banners</title>
<style>
:root{--paper:#F2EAE0;--surface:#FBF6EF;--line:#E0D0BE;--ink:#3A1D0E;
  --muted:#8A6A56;--accent:#DB521A}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
  --paper:#1B0E06;--surface:#2A160B;--line:#4A2C18;--ink:#F3E7DA;
  --muted:#B79880;--accent:#F2762F}}
:root[data-theme="dark"]{--paper:#1B0E06;--surface:#2A160B;--line:#4A2C18;
  --ink:#F3E7DA;--muted:#B79880;--accent:#F2762F}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.gate{min-height:100svh;display:grid;place-items:center;padding:24px}
form{width:100%;max-width:330px;display:flex;flex-direction:column;gap:14px}
h1{font:400 30px/1.15 "Hoefler Text",Baskerville,Georgia,serif;margin:0;
  letter-spacing:-.01em}
p{margin:0;color:var(--muted);font-size:14px}
label{font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
input{font:400 16px/1 system-ui,sans-serif;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
button{font:600 14px/1 system-ui,sans-serif;color:var(--surface);
  background:var(--accent);border:0;border-radius:999px;padding:12px 20px;
  cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:progress}
.msg{font-size:13px;color:var(--accent);min-height:1.3em}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
</style>
<div class="gate" id="gate"><form id="f" autocomplete="off">
  <h1>Cailler Autumn Banners</h1>
  <p>This preview is password protected.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="go" type="submit">View banners</button>
  <div class="msg" id="msg" role="status"></div>
</form></div>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const cat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);
  let i=0;for(const x of a){o.set(x,i);i+=x.length;}return o;};
const msg=document.getElementById('msg'),go=document.getElementById('go');

async function unlock(pw){
  const salt=b(SALT),nonce=b(NONCE),tag=b(TAG),ct=b(CT);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),
    'PBKDF2',false,['deriveBits']);
  const dk=new Uint8Array(await crypto.subtle.deriveBits(
    {name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},base,512));
  const encKey=dk.slice(0,32),macKey=dk.slice(32);
  const mk=await crypto.subtle.importKey('raw',macKey,{name:'HMAC',hash:'SHA-256'},
    false,['verify']);
  if(!await crypto.subtle.verify('HMAC',mk,tag,cat(salt,nonce,ct))) return null;
  // SHA-256 counter-mode keystream, built in parallel batches
  const blocks=Math.ceil(ct.length/32),ks=new Uint8Array(blocks*32);
  for(let base2=0;base2<blocks;base2+=256){
    const jobs=[];
    for(let i=base2;i<Math.min(base2+256,blocks);i++){
      const ctr=new Uint8Array(4);new DataView(ctr.buffer).setUint32(0,i);
      jobs.push(crypto.subtle.digest('SHA-256',cat(encKey,nonce,ctr))
        .then(d=>ks.set(new Uint8Array(d),i*32)));
    }
    await Promise.all(jobs);
  }
  const out=new Uint8Array(ct.length);
  for(let i=0;i<ct.length;i++) out[i]=ct[i]^ks[i];
  return new TextDecoder().decode(out);
}

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  go.disabled=true; msg.textContent='Unlocking…';
  let html=null;
  try{ html=await unlock(document.getElementById('pw').value); }
  catch(err){ msg.textContent='Could not unlock in this browser.'; go.disabled=false; return; }
  if(html===null){ msg.textContent='Wrong password.'; go.disabled=false;
    document.getElementById('pw').select(); return; }
  const f=document.createElement('iframe');
  f.setAttribute('title','Cailler Autumn Banners');
  document.body.innerHTML=''; document.body.appendChild(f); f.srcdoc=html;
});
